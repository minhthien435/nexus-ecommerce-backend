title = "NEX-105: Xây dựng Entity và DTO cho sổ địa chỉ người dùng"
description = "Tạo mô hình lưu trữ địa chỉ người dùng và các DTO tạo, cập nhật với dữ liệu hành chính Việt Nam cùng quy tắc kiểm tra số điện thoại người nhận."
